# regionsel configuration.
#
# Put your own copy at ~/.config/regionsel/config (or $XDG_CONFIG_HOME/regionsel/config).
# Your lines are applied ON TOP of the defaults below, so you only write what you change.
# `regionsel config` prints this file.
#
#   bind <key> [<key>] <action>   bind a key, or a two-key sequence such as "g g"
#   unbind <key> [<key>]          remove a binding
#   scrollback <lines>            history lines captured above the screen (0 = none)
#
# Keys: one character (j  G  $  0), ctrl-<char> (ctrl-d), or a name:
#   space enter esc backspace tab up down left right pageup pagedown home end
# The digits 1-9 (and 0 after another digit) are counts, as in "5j", and cannot be bound.
# A key cannot be both a binding and the start of a sequence: to bind "g" on its own,
# first `unbind g g`.
#
# Actions:
#   left down up right          move the cursor
#   word-forward word-back      move by word
#   line-start line-end         first / last character of the line
#   top bottom                  first / last row (including scrollback)
#   half-page-down half-page-up page-down page-up
#   expand shrink               grow / shrink the semantic selection (word > line > block > pane)
#   visual-char visual-line visual-block    manual selection modes (literal copy)
#   copy                        copy the selection (or the cursor's line) and close
#   cancel                      close without copying

scrollback 2000

bind h left
bind j down
bind k up
bind l right
bind left left
bind down down
bind up up
bind right right

bind w word-forward
bind b word-back
bind 0 line-start
bind $ line-end
bind g g top
bind G bottom

bind ctrl-d half-page-down
bind ctrl-u half-page-up
bind ctrl-f page-down
bind pagedown page-down
bind ctrl-b page-up
bind pageup page-up

bind space expand
bind backspace shrink
bind v visual-char
bind V visual-line
bind ctrl-v visual-block

bind enter copy
bind q cancel
bind esc cancel
bind ctrl-c cancel
