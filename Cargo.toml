[package]
name = "regionsel"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Region-aware text selection for terminal screens (tmux frontend)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "regionsel"
path = "src/main.rs"

[dependencies]
crossterm = "0.27"
vt100 = "0.15"

[profile.release]
lto = true
strip = true

[dev-dependencies]
# Only for tests/fixtures.rs: reading and writing the .expected.json snapshots.
serde_json = "1"
