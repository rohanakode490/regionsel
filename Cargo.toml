[package]
name = "regionsel"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Copy clean text out of full-screen terminal apps: region-aware selection for tmux"
readme = "README.md"
keywords = ["tmux", "terminal", "tui", "clipboard", "selection"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "regionsel"
path = "src/main.rs"

[dependencies]
crossterm = "0.27"
vt100 = "0.15"

[profile.release]
lto = true
strip = true

[dev-dependencies]
# Only for tests/fixtures.rs: reading and writing the .expected.json snapshots.
serde_json = "1"
